            const mergedFileCache = {};

            async function downloadAndMergeParts(fileName, partCount) {
              const parts = [];
              let totalLoaded = 0;
              for (let i = 0; i < partCount; i++) {
                const partUrl = buildUrl + "/parts/" + fileName + ".part" + i;
                const response = await fetch(partUrl);
                if (!response.ok)
                  throw new Error(
                    "Part indirilemedi: " +
                      partUrl +
                      " (HTTP " +
                      response.status +
                      ")",
                  );
                const arrayBuffer = await response.arrayBuffer();
                parts.push(new Uint8Array(arrayBuffer));
                totalLoaded += arrayBuffer.byteLength;
                console.log(
                  "  [" +
                    fileName +
                    "] Part " +
                    (i + 1) +
                    "/" +
                    partCount +
                    " (" +
                    (totalLoaded / 1048576).toFixed(1) +
                    " MB)",
                );
              }
              const totalSize = parts.reduce(function (sum, p) {
                return sum + p.length;
              }, 0);
              const merged = new Uint8Array(totalSize);
              let offset = 0;
              for (let j = 0; j < parts.length; j++) {
                merged.set(parts[j], offset);
                offset += parts[j].length;
              }
              LogStyledMessage(
                "[Merger] " +
                  fileName +
                  " birlestirildi: " +
                  (totalSize / 1048576).toFixed(1) +
                  " MB",
              );
              return merged.buffer;
            }

            async function mergeAllSplitFiles() {

                    splitFiles[fileName] +
                    " part)...",

                mergedFileCache[fileName] = await downloadAndMergeParts(
                  fileName,
                  splitFiles[fileName],
                );
              }
              LogStyledMessage(
                "[Merger] Tum dosyalar basariyla birlestirildi!",
              );
            }

            const originalFetch = window.fetch.bind(window);
            window.fetch = function (input, init) {
              const url =
                typeof input === "string"
                  ? input
                  : input && input.url
                  ? input.url
                  : "";
              for (const name of Object.keys(mergedFileCache)) {
                if (url.indexOf(name) !== -1 && mergedFileCache[name]) {
                  LogStyledMessage(
                    "[FetchOverride] " + name + " -> bellekten veriliyor",
                  );
                  var buf = mergedFileCache[name];
                  return Promise.resolve(
                    new Response(buf, {
                      status: 200,
                      statusText: "OK",
                      headers: {
                        "Content-Type": "application/octet-stream",
                        "Content-Length": buf.byteLength.toString(),
                      },
                    }),
                  );
                }
              }
              return originalFetch(input, init);
            };

            const OrigXHR = window.XMLHttpRequest;
            window.XMLHttpRequest = function PatchedXHR() {
              const xhr = new OrigXHR();
              const origOpen = xhr.open.bind(xhr);
              const origSend = xhr.send.bind(xhr);
              let interceptedFile = null;

              xhr.open = function (method, url) {
                interceptedFile = null;
                if (typeof url === "string") {
                  for (const name of Object.keys(mergedFileCache)) {
                    if (url.indexOf(name) !== -1 && mergedFileCache[name]) {
                      interceptedFile = name;
                      break;
                    }
                  }
                }
                return origOpen.apply(xhr, arguments);
              };

              xhr.send = function (body) {
                if (interceptedFile) {
                  LogStyledMessage(
                    "[XHROverride] " +
                      interceptedFile +
                      " -> bellekten veriliyor",
                  );
                  var buf = mergedFileCache[interceptedFile];
                  Object.defineProperty(xhr, "status", {
                    get: function () {
                      return 200;
                    },
                  });
                  Object.defineProperty(xhr, "statusText", {
                    get: function () {
                      return "OK";
                    },
                  });
                  Object.defineProperty(xhr, "readyState", {
                    get: function () {
                      return 4;
                    },
                  });
                  Object.defineProperty(xhr, "response", {
                    get: function () {
                      return buf;
                    },
                  });
                  setTimeout(function () {
                    if (xhr.onreadystatechange) xhr.onreadystatechange();
                    if (xhr.onload) xhr.onload();
                    try {
                      xhr.dispatchEvent(new Event("load"));
                    } catch (e) {}
                    try {
                      xhr.dispatchEvent(new Event("loadend"));
                    } catch (e) {}
                  }, 0);
                  return;
                }
                return origSend.apply(xhr, arguments);
              };

              return xhr;
            };
